name: Upload registry to KV

# Triggers:
#   - repository_dispatch (registry-updated): sent by CloudSecurityAlliance/SecID's
#     registry-ci.yml, and only after every registry validation gate passed.
#     Its client_payload.ref is the SecID commit SHA those gates validated, and
#     this workflow deploys exactly that commit — not whatever SecID main holds
#     by the time this run starts, which may be a later push that has not been
#     (or failed to be) validated.
#   - push to main: any merge into this repo (code, website, docs). There is no
#     validated SecID SHA for this event, so the registry comes from SecID main.
#   - workflow_dispatch: manual trigger from the gh CLI / Actions UI; also SecID
#     main.
#
# Every run syncs KV and deploys the Worker, because the Worker code and the KV
# contents must match. The Worker itself does not bundle the registry;
# src/registry.ts is regenerated here only so the tests run against the same
# registry that is about to be uploaded.
#
# Safety note: no untrusted GitHub event data (issue titles, PR bodies, commit
# messages, branch names) is interpolated into shell commands. The dispatch
# payload's ref is passed through an environment variable and rejected unless
# it is exactly 40 hex characters.

on:
  repository_dispatch:
    types: [registry-updated]
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny; the job grants only what it needs.
permissions: {}

# Two overlapping `--sync` runs can each delete keys the other just wrote (each
# treats keys it did not produce as orphans). Serialize every deploy; never
# cancel one mid-flight. A newer queued run supersedes an older *pending* one,
# which is fine: the newer run deploys a newer registry.
concurrency:
  group: registry-deploy
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout SecID-Service
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select SecID revision
        id: rev
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # Fail closed: a dispatch without a validated SHA cannot say which
            # registry passed the gates, and deploying main instead is exactly
            # the race this check exists to prevent.
            if [[ ! "$PAYLOAD_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::repository_dispatch client_payload.ref must be a 40-hex commit SHA; refusing to deploy."
              exit 1
            fi
            echo "ref=$PAYLOAD_REF" >> "$GITHUB_OUTPUT"
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout SecID spec repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CloudSecurityAlliance/SecID
          ref: ${{ steps.rev.outputs.ref }}
          path: secid-spec
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the dispatched SHA is on SecID main
        if: steps.rev.outputs.pinned == 'true'
        working-directory: secid-spec
        env:
          SHA: ${{ steps.rev.outputs.ref }}
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of SecID main; refusing to deploy."
            exit 1
          fi
          echo "Deploying SecID registry at $SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        run: cd website && npm ci

      - name: Build registry snapshot for tests
        run: npx tsx scripts/build-registry.ts ./secid-spec

      - name: Build website
        run: npm run build:website

      - name: Run tests
        run: npx vitest run

      - name: Upload registry to KV (sync mode — also deletes orphans)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SECID_SERVICE_DEPLOY }}
        run: npx tsx scripts/upload-registry-kv.ts --sync ./secid-spec

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SECID_SERVICE_DEPLOY }}
        run: npx wrangler deploy
